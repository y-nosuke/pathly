name: Release

# vX.Y.Z のタグを push したら、リリース鍵で署名したリリース版 APK を作り、GitHub Release に載せる。
# 手順と前提（Secrets の登録など）は docs/designs/release.md。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      # versionCode（コミット数）と versionName（タグ）を git から決めるため、全履歴とタグを取る
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.properties

      # 鍵が無いまま未署名の APK を配らないよう、ここで止める
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 が未登録です（docs/designs/release.md）"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_pathlyReleaseStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_pathlyReleaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_pathlyReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_pathlyReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # 署名されていること・versionName がタグと一致することを確かめてから配る
      - name: Verify APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | grep -v rc | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "$apk"
          name=$("$bt/aapt2" dump badging "$apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::versionName ($name) がタグ ($GITHUB_REF_NAME) と一致しません"
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/pathly-$GITHUB_REF_NAME.apk"
          # R8 で名前を短くしているので、スタックトレースを読み解く対応表も一緒に残す
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/mapping-$GITHUB_REF_NAME.txt"

      # 変更点は前のリリースからの PR のタイトルで自動生成する。v1.0.0-rc.1 のような版はプレリリース扱い
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/pathly-$GITHUB_REF_NAME.apk" "$RUNNER_TEMP/mapping-$GITHUB_REF_NAME.txt" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
