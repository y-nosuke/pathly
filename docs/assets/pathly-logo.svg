<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108" role="img" aria-label="Pathly logo">
  <defs>
    <linearGradient id="pathly-bg" x1="0" y1="0" x2="0" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8C5A" />
      <stop offset="0.5" stop-color="#FF6B35" />
      <stop offset="1" stop-color="#E55A2B" />
    </linearGradient>
  </defs>
  <!-- 背景（アプリアイコンのオレンジグラデ） -->
  <rect width="108" height="108" rx="24" fill="url(#pathly-bg)" />
  <!-- 経路（ルート） -->
  <path d="M33,84 C33,66 57,74 57,58" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 開始地点のドット -->
  <path fill="#FFFFFF" d="M27.5,84 A5.5,5.5 0 1,0 38.5,84 A5.5,5.5 0 1,0 27.5,84 Z" />
  <!-- 目的地ピン（中央は evenodd で抜き） -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="M57,22 C46,22 37,31 37,42 C37,56 57,66 57,66 C57,66 77,56 77,42 C77,31 68,22 57,22 Z M57,34.5 A7.5,7.5 0 1,0 57,49.5 A7.5,7.5 0 1,0 57,34.5 Z" />
</svg>
